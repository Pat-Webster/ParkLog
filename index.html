<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Parkinson's / DBS Log  V1.05</title>

    <link
        rel="stylesheet"
        href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
</head>

<body>

<div class="app">

    <h1>Parkinson's / DBS Log v1.05</h1>

    <!-- DATE / TIME -->


    <!-- SYMPTOMS -->

    <section class="card">

        <h2>Symptoms</h2>

        <div class="sliderRow">
            <label for="tremor">
                Tremor
            </label>
            <input type="range"
                id="tremor"
                min="0" max="10"
                value="5">
            <span id="tremorValue">—</span>
        </div>

        <div class="sliderRow">
            <label for="stiffness">
                Rigidity
            </label>
            <input type="range"
                id="stiffness"
                min="0" max="10"
                value="5">
            <span id="stiffnessValue">—</span>
        </div>

        <div class="sliderRow">
            <label for="dystonia">
                Dystonia
            </label>
            <input type="range"
                id="dystonia"
                min="0" max="10"
                value="5">
            <span id="dystoniaValue">—</span>
        </div>

        <div class="sliderRow">
            <label for="balance">
               Balance
            </label>
            <input type="range"
                id="balance"
                min="0" max="10"
                value="5">
            <span id="balanceValue">—</span>
        </div>

        <div class="sliderRow">
            <label for="dyskinesia">
                Dyskinesia
            </label>
            <input type="range"
                id="dyskinesia"
                min="0" max="10"
                value="5">
            <span id="dyskinesiaValue">—</span>
        </div>

        <div class="sliderRow">
            <label for="depression">
                Depression
            </label>
            <input type="range"
                id="depression"
                min="0" max="10"
                value="5">
            <span id="depressionValue">—</span>
        </div>

        <div class="sliderRow">
            <label for="sleep">
                Sleep
            </label>
            <input type="range"
                id="sleep"
                min="0" max="10"
                value="5">
            <span id="sleepValue">—</span>
        </div>

        <div class="sliderRow">
            <label for="energy">
                Energy
            </label>
            <input type="range"
                id="energy"
                min="0" max="10"
                value="5">
            <span id="energyValue">—</span>
        </div>

 
    </section>

   <!-- ENTRY BUTTONS -->
<section class="card">

    <div class="row">

        <button
            type="button"
            id="resetButton"
            class="entryButton">
            Reset Entry
        </button>

        <button
            type="button"
            id="saveButton"
            class="entryButton"
            disabled>
            Save Entry
        </button>

    </div>

</section> 

    <!-- DBS -->

    <section class="card">

        <h2>DBS Settings</h2>

        <div class="medRow">
            <label for="dbsProgram">
                Program
            </label>

            <select id="dbsProgram">
                <option value="">
                    Not entered
                </option>
                <option value="1">Program 1</option>
                <option value="2">Program 2</option>
                <option value="3">Program 3</option>
                <option value="4">Program 4</option>
            </select>

            <label for="dbsLevel">
                Amplitude / Level
            </label>
            <input class = "doseInput"
                type="number"
                id="dbsLevel"
                step="0.1">
        </div>

        <div class="medRow">
            <label for="dbsPulseWidth">
                Pulse Width (µs)
            </label>

            <input  class = "doseInput"
                type="number"
                id="dbsPulseWidth"
                step="1">

            <label for="dbsFrequency">
                Frequency (Hz)
            </label>
            <input class = "doseInput"
                type="number"
                id="dbsFrequency"
                step="1">
        </div>

    </section>

    <section class="card">

        <h2>Observation Time</h2>

        <div class="row">
            <label for="entryDate">
                Date
            </label>

            <input
                type="date"
                id="entryDate">
                 <label for="entryTime">
                Time
            </label>

            <input
                type="time"
                id="entryTime">
        </div>

    </section>


    <!-- NOTES -->

 <section class="card">

    <h2>Notes</h2>

    <textarea
        id="notes"
        rows="4"
        placeholder="Anything unusual?"></textarea>

    <button
        type="button"
        id="voiceNotesButton">
        🎤 Speak Note
    </button>

    <div id="voiceStatus"
         class="smallText">
    </div>

</section>

 

    <!-- MEDICATION -->

<section class="card">


        <h2>Medication</h2>

        <div class="smallText">
            Medication is recorded using the
            Observation Time above.
        </div>

        <div class="medRow">

            <span>
                Carbidopa
            </span>
            <span>  
            <input class ="doseInput"
                type="text"
                id="carbidopaDose">
            <label for="carbidopaDose">
                (mg)
            </label>
                
            </span>

            <button
                type="button"
                class="medButton"
                data-medication="Carbidopa/Levodopa"
                data-dose-input="carbidopaDose">
                 Save
            </button>

        </div>

        <div class="medRow">

            <span>
                Ropinirole
            </span>

            <span>
            <input class ="doseInput"
                type="number"
                id="RopaDose">
            <label for="RopaDose">
                (mg)
            </label>
            </span>

            <button
                type="button"
                class="medButton"
                data-medication="Ropinirole"
                data-dose-input="RopaDose">
                Save
            </button>

        </div>

       <div class="medRow">
            <span>
                Other Medication
            </span>

            <span>
            <input class ="doseInput"
                type="number"
                id="OtherDose">
            <label for="MedDose">
                (mg)
            </label>
            </span>

            <button
                type="button"
                class="medButton"
                data-medication="Other"
                data-dose-input="OtherDose">
                Save
            </button>

        </div>

    </section>


    <!-- SLEEP -->

 
    <!-- TIMELINE -->
    <!-- ENTRY BUTTONS -->
<section class="card">
     <h2>Timeline</h2>
     
   <div class="row">
        <button type = "button"
            id="refreshTimelineButton"
            class="entryButton">
            Refresh Timeline
        </button>

        <button type="button" 
            id="downloadCSVButton"
            class="entryButton">
            Download CSV
        </button>

    </div>
     
</section> 


    <section class="card">

        <div
            id="timeline"
            class="scrollList">
        </div>

    </section>


    <!-- OBSERVATIONS -->

    <section class="card">

        <h2>Recent Observations</h2>

        <div
            id="entryList"
            class="scrollList">
        </div>

    </section>

</div>
<section class="card">

    <h2>Symptom Graph</h2>

    <div class="graphControls">

        <label for="graphMetric">
            What to graph:
        </label>

        <select id="graphMetric">

             <option value="tremor">
                Tremor
            </option>

            <option value="stiffness">
                Stiffness / Rigidity
            </option>

            <option value="dystonia">
                Dystonia / Cramping
            </option>

            <option value="balance">
                Walking / Balance
            </option>

            <option value="dyskinesia">
                Dyskinesia
            </option>

            <option value="depression">
                Depression
            </option>

            <option value="sleep">
                Sleep
            </option>

            <option value="energy">
                Energy
            </option>
        </select>

    </div>

    <canvas
        id="symptomGraph"
        width="560"
        height="300">
    </canvas>

</section>

<script src="app.js"></script>

</body>
</html>
